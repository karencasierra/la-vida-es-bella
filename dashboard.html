<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS Premium | La Vida es Bella</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap');

        :root {
            --oro: #C9A84C;
            --oro-claro: #E8C96B;
            --oro-glow: rgba(201,168,76,0.3);
            --cian: #00FBFF;
            --fondo: #080706;
            --card-bg: #100F0D;
            --card-border: rgba(201,168,76,0.15);
            --text-muted: #6B6560;
            --text-soft: #B0A89E;
            --danger: #ff453a;
            --success: #30d158;
            --text-main: #ffffff;
            --border: rgba(201,168,76,0.15);
        }

        body { 
            background: var(--fondo); 
            color: var(--text-main); 
            font-family: 'DM Sans', sans-serif; 
            margin: 0; 
            padding: 24px; 
            overflow-x: hidden; 
            min-height: 100vh;
        }

        /* GRAIN OVERLAY */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.3;
        }

        header {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: var(--card-bg); 
            padding: 18px 32px; 
            border-radius: 20px;
            border: 1px solid var(--border); 
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 25px; 
            align-items: start; 
            margin-bottom: 50px;
        }

        /* TARJETAS KDS */
        .card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); 
            position: relative; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
        }

        .card.estado-nuevo { border-top: 6px solid var(--cian); }
        .card.estado-preparando { border-top: 6px solid var(--oro); }
        .card.estado-saliendo { border-top: 6px solid var(--success); animation: pulse-card 2s infinite; }

        @keyframes pulse-card { 
            0% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0.3); } 
            70% { box-shadow: 0 0 0 15px rgba(48, 209, 88, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(48, 209, 88, 0); } 
        }

        /* MINIMIZADO MANUAL */
        .card.minimizado .items-container, .card.minimizado .card-footer { display: none; }
        .card.minimizado { opacity: 0.5; }

        .card-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .mesa-info h3 { margin: 0; font-size: 1.15rem; font-weight: 700; color: var(--cian); letter-spacing: 0.5px; }
        
        .btn-mini { background: #181715; border: 1px solid var(--border); color: var(--oro); width: 32px; height: 32px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .btn-mini:hover { background: var(--oro); color: #000; }

        .items-container { padding: 20px; }
        .item-row { display: flex; gap: 15px; margin-bottom: 12px; font-size: 1.05rem; font-weight: 500; align-items: center; }
        .qty { background: var(--oro); color: #000; min-width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 0.75rem; font-weight: 700; padding: 0 6px; }
        .item-name { color: var(--text-soft); }

        .card-footer { padding: 15px; }
        .btn-action { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.72rem; cursor: pointer; text-transform: uppercase; transition: all 0.22s; }
        .btn-action:active { transform: scale(0.96); }
        
        .btn-nuevo { background: var(--cian); color: #000; }
        .btn-preparando { background: var(--oro); color: #000; }
        .btn-saliendo { background: var(--success); color: #000; }

        /* PANEL DE HISTORIAL OCULTO (DRAWER) */
        #panel-historial {
            position: fixed; right: -400px; top: 0; width: 350px; height: 100%;
            background: #090807; border-left: 1px solid var(--border);
            z-index: 1000; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.8);
        }
        #panel-historial.active { right: 0; }
        
        .historial-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .h-card { background: var(--card-bg); padding: 16px; border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;}
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 999; backdrop-filter: blur(2px); }
        .overlay.active { display: block; }

        .btn-view-historial { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.65rem; transition: all 0.2s;}
        .btn-view-historial:hover { border-color: var(--oro); color: var(--oro); }

        /* TOAST */
        #toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #111;
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid rgba(201,168,76,0.3);
            opacity: 0;
            transform: translateY(20px);
            transition: all .3s;
            z-index: 9999;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center; gap: 20px;">
        <img src="logo.jpeg" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);" alt="Logo">
        <div>
            <h1 style="margin:0; font-size:1.15rem; color:var(--oro); letter-spacing:2px; font-weight: 700; font-family: 'Cormorant Garamond', serif;">LA VIDA ES BELLA</h1>
            <small id="reloj" style="color:var(--cian); font-family:monospace; font-size: 0.65rem;"></small>
        </div>
    </div>
    <div style="display: flex; gap: 15px;">
        <button class="btn-view-historial" onclick="toggleHistorial(true)">
            <i class="fas fa-history"></i> VER RECIENTES
        </button>
        <div id="counter" style="background: rgba(201,168,76,0.1); padding: 10px 20px; border-radius: 12px; color: var(--oro); font-weight: 700; font-size: 0.68rem; border: 1px solid rgba(201,168,76,0.2); letter-spacing: 0.8px;">
            0 ÓRDENES
        </div>
    </div>
</header>

<div class="grid" id="kds-grid"></div>

<div id="overlay-hist" class="overlay" onclick="toggleHistorial(false)"></div>
<div id="panel-historial">
    <div class="historial-header">
        <h2 style="font-size: 0.72rem; letter-spacing: 2px; color: var(--oro); font-weight: 700;">HISTORIAL HOY</h2>
        <button onclick="toggleHistorial(false)" style="background:none; border:none; color:gray; cursor:pointer;"><i class="fas fa-times"></i></button>
    </div>
    <div id="lista-historial-vacia" style="color:gray; font-size: 0.72rem; text-align:center; margin-top:40px;">No hay despachos recientes.</div>
    <div id="contenedor-historial-items"></div>
</div>

<div id="toast"></div>
<audio id="sonido" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>

<script>
    // Sistema de seguridad: Solicitar contraseña antes de cargar
    const clave = prompt("Ingrese clave de cocina");
    if (clave !== "1234") {
        document.body.innerHTML = "<h1 style='color:white;text-align:center;margin-top:100px;'>Acceso denegado</h1>";
        throw new Error("No autorizado");
    }

    // Inicialización del SDK v10 (con compatibilidad de Firestore)
    const firebaseConfig = {
        apiKey: "AIzaSyCDlGrzItpJAhtlrDyXLbIX46osGOk3k2s",
        authDomain: "la-vida-es-bella-a2e72.firebaseapp.com",
        databaseURL: "https://la-vida-es-bella-a2e72-default-rtdb.firebaseio.com",
        projectId: "la-vida-es-bella-a2e72",
        storageBucket: "la-vida-es-bella-a2e72.firebasestorage.app",
        messagingSenderId: "622395641878",
        appId: "1:622395641878:web:bc3afbeb29d73a59e8a537",
        measurementId: "G-SCEWG1HQ6F"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    let minimizados = new Set();
    let pedidosPrevios = new Set();

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg;
        t.style.opacity = 1;
        t.style.transform = "translateY(0)";
        setTimeout(() => {
            t.style.opacity = 0;
            t.style.transform = "translateY(20px)";
        }, 2000);
    }

    function toggleHistorial(show) {
        document.getElementById('panel-historial').classList.toggle('active', show);
        document.getElementById('overlay-hist').classList.toggle('active', show);
    }

    function toggleMinimize(id) {
        if (minimizados.has(id)) {
            minimizados.delete(id);
        } else {
            minimizados.add(id);
        }
        
        // Forzar la recarga visual al interactuar
        db.collection("pedidos").get().then(() => {});
    }

    function updateEstado(id, nuevoEstado, btn = null) {
        if (btn) {
            btn.disabled = true;
            btn.innerText = "PROCESANDO...";
        }

        const sonido = document.getElementById("sonido");
        sonido.play();

        db.collection("pedidos").doc(id).update({ estado: nuevoEstado })
        .then(() => {
            showToast("Pedido actualizado ✔");
        })
        .catch((error) => {
            console.error("Error al actualizar:", error);
            showToast("Error al actualizar ❌");
            if (btn) {
                btn.disabled = false;
                btn.innerText = "INTENTAR DE NUEVO";
            }
        });
    }

    db.collection("pedidos").onSnapshot(snapshot => {
        const grid = document.getElementById("kds-grid");
        const histContainer = document.getElementById("contenedor-historial-items");
        
        grid.innerHTML = ""; 
        histContainer.innerHTML = "";
        
        let count = 0;
        let historicos = 0;

        snapshot.forEach(doc => {
            const p = { id: doc.id, ...doc.data() };
            const est = p.estado || "NUEVO";

            // Detectar si hay un nuevo pedido para reproducir sonido y notificar
            if (!pedidosPrevios.has(p.id)) {
                pedidosPrev = pedidosPrevios.add(p.id);
                if (est === "NUEVO") {
                    document.getElementById("sonido").play();
                    showToast("Nuevo pedido recibido 🍽️");
                }
            }

            // ÓRDENES ACTIVAS
            if (p.pagado !== true && est !== "ENTREGADO") {
                count++;
                const isMini = minimizados.has(p.id) ? 'minimizado' : '';
                
                let btnClass = "btn-nuevo", btnText = "ACEPTAR", nextEst = "PREPARANDO";
                
                if (est === "PREPARANDO") { 
                    btnClass = "btn-preparando"; 
                    btnText = "SALIDA"; 
                    nextEst = "SALIENDO"; 
                } else if (est === "SALIENDO") { 
                    btnClass = "btn-saliendo"; 
                    btnText = "FINALIZAR"; 
                    nextEst = "ENTREGADO"; 
                }

                grid.innerHTML += `
                    <div class="card estado-${est.toLowerCase()} ${isMini}">
                        <div class="card-header">
                            <div class="mesa-info">
                                <h3>MESA ${p.mesa}</h3>
                                <small style="color:var(--text-muted); font-weight:700; font-size:9px;">${est}</small>
                            </div>
                            <button class="btn-mini" onclick="toggleMinimize('${p.id}')">
                                <i class="fas ${isMini ? 'fa-expand-alt' : 'fa-minus'}"></i>
                            </button>
                        </div>
                        <div class="items-container">
                            ${(p.items || []).map(i => `
                                <div class="item-row">
                                    <div class="qty">${i.cantidad}x</div>
                                    <div class="item-name">${(i.nombre || '').toUpperCase()}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="card-footer">
                            <button class="btn-action ${btnClass}" onclick="updateEstado('${p.id}', '${nextEst}', this)">
                                ${btnText}
                            </button>
                        </div>
                    </div>`;
            } 
            // HISTORIAL
            else if (est === "ENTREGADO") {
                historicos++;
                histContainer.innerHTML += `
                    <div class="h-card">
                        <div>
                            <div style="font-weight:900; color:var(--oro); font-size:0.72rem;">MESA ${p.mesa}</div>
                            <div style="font-size:0.55rem; color:gray;">Completado</div>
                        </div>
                        <button onclick="updateEstado('${p.id}','PENDIENTE')" style="background:none; border:1px solid var(--border); color:gray; border-radius:8px; padding:6px 12px; cursor:pointer; font-size:10px;">
                            <i class="fas fa-undo"></i>
                        </button>
                    </div>`;
            }
        });

        document.getElementById("lista-historial-vacia").style.display = historicos > 0 ? 'none' : 'block';
        document.getElementById("counter").innerText = `${count} ÓRDENES ACTIVAS`;
    });

    // Reloj en tiempo real
    setInterval(() => {
        document.getElementById('reloj').innerText = new Date().toLocaleTimeString();
    }, 1000);
</script>
</body>
</html>
